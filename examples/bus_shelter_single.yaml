# Single-zone open-sided bus shelter (HiMCM 2026 Problem B, smallest complete working slice).
# SYNTHETIC DEMONSTRATION: geometry, airflow and occupancy are assumptions, not a survey.
# Multi-zone coupling, search and uncertainty are intentionally omitted here.
include: [common/physics_materials.yaml, common/devices.yaml, common/templates.yaml]

meta:
  name: "Single-zone open bus shelter"
  description: "One open-sided 4 m x 1.8 m roofed shelter over a 24 h synthetic hot/dry day."
  data_status: SYNTHETIC_DEMONSTRATION
  notes:
    - "Single section only: no curb, no inter-section exchange."
    - "One exposure group covers the whole shelter (simplest coverage story for Problem B devices)."
    - "Equipment airflow, coverage speed, effectiveness and outdoor exchange are DEMO-ASSUMPTIONS; see docs/ASSUMPTIONS_SINGLE_ZONE.md."

site: {latitude_deg: 33.45, longitude_deg: -112.07, utc_offset_h: -7, day_of_year: 196}
weather: {file: data/weather_hot_dry.csv}
occupancy: {file: data/occupancy_bus_shelter_single.csv}
simulation: {start_h: 0, end_h: 24, warmup_days: 2, output_step_s: 300}

sections:
  - id: shelter
    name: "Shelter (roofed bench area)"
    template: roofed_open_seating
    footprint: [[0, 0], [4, 0], [4, 1.8], [0, 1.8]]
    height_m: 2.6
    surfaces:
      - id: roof
        material: polycarbonate
        thickness: {value: 8, unit: "mm", source: "DEMO-ASSUMPTION: solid polycarbonate canopy"}
        solar_absorptance_exterior: {value: 0.5, unit: "-", source: "DEMO-ASSUMPTION: tinted polycarbonate (absorbed share; transmission neglected)", bounds: [0.35, 0.65]}
      - id: rear_panel
        kind: wall
        material: glass
        thickness: {value: 10, unit: "mm", source: "DEMO-ASSUMPTION: toughened glass ad panel"}
        nodes: 1
        area_m2: 8.0
        azimuth_deg: 0
        emissivity: {value: 0.84, unit: "-", source: "glass"}
        solar_absorptance_exterior: {value: 0.15, unit: "-", source: "clear glass absorbed fraction"}
        exterior_sky_fraction: 0.5
        interior_sky_fraction: 0.3
    sun: {mode: canopy, canopy_height_m: 2.6, canopy_depth_m: 1.8,
          open_side_fraction: {value: 0.5, unit: "-", source: "DEMO-ASSUMPTION: street side open to the south", bounds: [0.3, 0.7]}}
    outdoor:
      opening_area_m2: 14.0
    radiation:
      floor_view: {roof: 0.55, walls: 0.15, sky: 0.1}
      occupant_view: {floor: 0.45, roof: 0.3, walls: 0.15, sky: 0.05}
    exposure_groups:
      - {id: all, occupant_share: 1.0}

devices:
  - {id: fan_A, preset: fan_system, serves: [{section: shelter, airflow_fraction: 1.0, groups: [all]}], schedule: service_hours}
  - {id: evap_B, preset: evaporative_cooler, serves: [{section: shelter, airflow_fraction: 1.0, groups: [all]}], schedule: service_hours}
  - {id: evap_C, preset: large_evaporative_cooler, serves: [{section: shelter, airflow_fraction: 1.0, groups: [all]}], schedule: service_hours}

scenarios:
  - {id: baseline, description: "No cooling equipment"}
  - {id: A_fan, description: "0.25 kW fan system, service hours 06-22", devices: [fan_A]}
  - {id: B_evap, description: "1.2 kW evaporative cooler, service hours 06-22", devices: [evap_B]}
  - {id: C_large_evap, description: "2.5 kW large evaporative cooler, service hours 06-22", devices: [evap_C]}
